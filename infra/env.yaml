# Applied once:
#   ant beta:environments create < infra/env.yaml --transform id -r
#
# Environment names must be unique — creating one with an existing name is a 409.

name: multiplayer-room
description: Container configuration for shared agent rooms.

config:
  type: cloud
  # Deny-by-default egress. Every tool this agent has is client-side, executed
  # in a member's editor, so the container itself never needs the network.
  # Loosen this only when adding a server-side tool or an MCP server — and then
  # list the specific hosts rather than switching to unrestricted.
  networking:
    type: limited
