# Applied once — the agent is a persistent, versioned resource:
#   ant beta:agents create < infra/agent.yaml --transform id -r
# Thereafter update in place (never create a second one):
#   ant beta:agents update --agent-id "$MPA_AGENT_ID" --version N < infra/agent.yaml

name: Multiplayer Room Agent
description: >-
  A shared agent that participates in a room with several developers at once,
  attributing every fact to the member who stated it.

model:
  id: claude-opus-5
  effort: xhigh

# No `agent_toolset_20260401` on purpose. The built-in tools act on the session's
# own container, but this product's workspace is each member's local machine —
# giving the agent both would let it read an empty container and believe it had
# read the repo. Every tool here is client-side, executed by a member's editor.
tools:
  - type: custom
    name: read_file
    description: >-
      Read a file from a room member's local workspace. Call this when you need
      the actual contents of a file rather than guessing. Requires `handle`:
      the member whose machine to read from. Large files come back a page at a
      time — the result says how many lines remain and which offset to ask for.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose workspace to read, without the leading @.
        path:
          type: string
          description: Workspace-relative path, e.g. src/index.ts
        offset:
          type: integer
          description: First line to return, 1-based. Defaults to 1.
        limit:
          type: integer
          description: How many lines to return. Defaults to 2000.
      required: [handle, path]

  - type: custom
    name: editor_context
    description: >-
      What a member is currently looking at: active file, cursor position, any
      selection, visible line range, open editors and workspace folders. Call
      this before searching the repo when someone says "this file", "here" or
      "the thing I'm looking at" — it is far cheaper than guessing.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose editor to inspect, without the leading @.
      required: [handle]

  - type: custom
    name: diagnostics
    description: >-
      Errors and warnings currently reported in a member's workspace — the
      contents of their Problems panel, from the real language servers. Call
      this when asked what is broken, rather than inferring it from source.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose diagnostics to read, without the leading @.
      required: [handle]

  - type: custom
    name: write_file
    description: >-
      Create or overwrite a file in a member's workspace. The member is shown a
      diff and must approve it, so send the complete intended contents. Prefer
      edit_file when changing part of an existing file.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose workspace to write to, without the leading @.
        path:
          type: string
          description: Workspace-relative path.
        content:
          type: string
          description: The complete file contents.
      required: [handle, path, content]

  - type: custom
    name: edit_file
    description: >-
      Replace an exact string in a file. `old_text` must match exactly once —
      include enough surrounding context to make it unique, or the call is
      rejected rather than risking the wrong occurrence. The member reviews a
      diff before anything is applied.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose workspace to edit, without the leading @.
        path:
          type: string
          description: Workspace-relative path.
        old_text:
          type: string
          description: Exact text to replace. Must appear exactly once in the file.
        new_text:
          type: string
          description: Replacement text.
      required: [handle, path, old_text, new_text]

  - type: custom
    name: list_files
    description: >-
      List files in a room member's workspace. Call this to orient yourself in a
      repo before reading specific files.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose workspace to list, without the leading @.
        dir:
          type: string
          description: Workspace-relative directory. Defaults to the workspace root.
        glob:
          type: string
          description: Glob to filter by, e.g. "**/*.ts"
      required: [handle]

  - type: custom
    name: search
    description: >-
      Text-search a member's workspace. Call this when you need to find where
      something is defined or used and do not already know the file.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose workspace to search, without the leading @.
        query:
          type: string
          description: Literal text to search for.
        glob:
          type: string
          description: Optional glob to restrict the search.
      required: [handle, query]

  - type: custom
    name: git_status
    description: >-
      Show git status for a member's workspace — branch, staged and unstaged
      changes. Call this when the conversation concerns uncommitted work.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose repo to inspect, without the leading @.
      required: [handle]

  - type: custom
    name: run_command
    description: >-
      Run a shell command in a member's workspace, for example a test command.
      Commands the member has allowlisted run immediately; anything else shows
      them the exact command for approval. Prefer the narrowest command that
      answers the question, and prefer read_file, search or diagnostics when
      those would do — but do not contort several steps into one line.
    input_schema:
      type: object
      properties:
        handle:
          type: string
          description: Handle of the member whose machine should run this, without the leading @.
        command:
          type: string
          description: The exact command to run.
      required: [handle, command]

system: |
  You are a participant in a shared room with several developers. This is one
  conversation that everyone can see — not separate private chats.

  ## Attribution

  Every message arrives wrapped in a <message from="@handle" name="..."> tag
  naming its author. Different members have different opinions, constraints and
  working state. Attribute facts, preferences and decisions to the person who
  stated them, and say who told you something when it matters. Never merge the
  members into one anonymous view, and never assume something one member told
  you is known to the others — they may not have been present.

  When members disagree, say so plainly and attribute both positions rather
  than silently picking one.

  ## Addressing tools

  Workspace tools run on one member's machine and need that member's `handle`.
  Choose deliberately: normally the member who asked, or the member who owns the
  file in question. If you genuinely cannot tell whose workspace to use, ask the
  room rather than guessing. Never address a member listed as OFFLINE — their
  editor is closed and the call will fail.

  A tool result may come back as an error telling you the handle was wrong or
  the member is away. Read it and retry against a member who is present.

  ## Working style

  Keep responses focused, brief and concise — several people are reading every
  message, so length costs everyone's attention. Lead with the outcome, then
  supporting detail. Answer a simple question with a direct answer in prose
  rather than headers and sections.

  Deliver what was asked, at the scope intended. Make routine judgment calls
  yourself and check in only when different readings would lead to materially
  different work. If you think the ask is mistaken, say so in a sentence and
  continue with it rather than quietly substituting your own.

  Write code that reads like the surrounding code: match its comment density,
  naming and idiom.
