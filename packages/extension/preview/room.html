<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ripieno — room preview</title>
<style>
  /* VS Code supplies these at runtime; the preview stands in for it so the
     real stylesheet renders exactly as it does inside the editor. Values are
     taken from Dark+ / Light+. */
  :root {
    --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --vscode-font-size: 13px;
    --vscode-editor-font-family: "SF Mono", Menlo, Consolas, monospace;

    --vscode-foreground: #cccccc;
    --vscode-editor-background: #1f1f1f;
    --vscode-editorWidget-background: #202020;
    --vscode-panel-border: #2b2b2b;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-badge-background: #616161;
    --vscode-badge-foreground: #f8f8f8;
    --vscode-input-background: #313131;
    --vscode-input-foreground: #cccccc;
    --vscode-input-border: #3c3c3c;
    --vscode-button-background: #0078d4;
    --vscode-button-foreground: #ffffff;
    --vscode-button-hoverBackground: #026ec1;
    --vscode-focusBorder: #0078d4;
    --vscode-textCodeBlock-background: #2b2b2b;
    --vscode-inputValidation-errorBackground: #5a1d1d;
    --vscode-inputValidation-errorForeground: #f48771;
    --vscode-inputValidation-warningBackground: #5a4b1d;
    --vscode-inputValidation-warningForeground: #f4d871;
  }

  html[data-theme="light"] {
    --vscode-foreground: #3b3b3b;
    --vscode-editor-background: #ffffff;
    --vscode-editorWidget-background: #f8f8f8;
    --vscode-panel-border: #e5e5e5;
    --vscode-descriptionForeground: #6a6a6a;
    --vscode-badge-background: #cccccc;
    --vscode-badge-foreground: #3b3b3b;
    --vscode-input-background: #ffffff;
    --vscode-input-foreground: #3b3b3b;
    --vscode-input-border: #cecece;
    --vscode-button-background: #005fb8;
    --vscode-button-hoverBackground: #0258a8;
    --vscode-focusBorder: #005fb8;
    --vscode-textCodeBlock-background: #f3f3f3;
    --vscode-inputValidation-errorBackground: #fdd;
    --vscode-inputValidation-errorForeground: #a1260d;
    --vscode-inputValidation-warningBackground: #fdf6d3;
    --vscode-inputValidation-warningForeground: #7a6a00;
  }
</style>
<link rel="stylesheet" href="../media/main.css?v=7" />
</head>
<body>
<!-- Markup below mirrors roomView.ts so this exercises the shipped webview. -->
<header id="header" class="header">
  <div class="room-meta">
    <div id="roomLabel" class="room-label">Not connected</div>
    <span id="modeBadge" class="mode-badge" hidden></span>
  </div>
  <div id="statusPill" class="status-pill idle" role="status" aria-live="polite">idle</div>
  <div id="roster" class="roster" role="list" aria-label="People in this room"></div>
</header>
<section id="onboarding" class="onboarding" aria-labelledby="onboardingTitle">
  <h2 id="onboardingTitle" class="sr-only">Getting started</h2>
  <ol id="onboardingSteps" class="onboarding-steps" aria-label="Getting started progress"></ol>
  <button id="onboardingAction" class="onboarding-action" type="button" hidden></button>
  <p id="onboardingHelp" class="onboarding-help" hidden>A ChatGPT web conversation cannot be imported. To use Codex, install the Codex CLI and run <code>codex login</code> to sign in with ChatGPT, or use an API key. API-key usage is billed separately through the OpenAI Platform.</p>
</section>
<div class="transcript-wrap">
  <div id="transcript" class="transcript" role="log" aria-live="polite" aria-label="Room conversation"></div>
  <button id="jumpLatest" class="jump-latest" type="button" hidden>Latest <span aria-hidden="true">↓</span></button>
</div>
<details id="goals" class="goals" hidden>
  <summary id="goalsSummary" class="goals-summary">Goals</summary>
  <div id="goalsList" class="goals-list" role="list" aria-label="Room goals"></div>
</details>
<div id="goalAnnouncements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<section id="handoffs" class="handoffs" aria-labelledby="handoffsTitle" hidden>
  <div id="handoffsTitle" class="handoffs-title">Agent handoffs</div>
  <div id="handoffsList" class="handoffs-list" role="list" aria-label="Agent handoff lifecycle"></div>
</section>
<div id="handoffAnnouncements" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<details id="actions" class="actions" hidden>
  <summary id="actionsSummary" class="actions-summary">Work</summary>
  <div id="actionsList" class="actions-list"></div>
</details>
<div id="approvalStack" class="approval-stack" aria-live="assertive"></div>
<div id="composerValidation" class="composer-validation" role="alert" hidden></div>
<div id="composerBar" class="composer-bar">
  <div id="mentions" class="mentions" role="listbox" aria-label="Message suggestions" hidden></div>
  <textarea id="composer" class="composer" rows="1" aria-label="Message the room" aria-controls="mentions" aria-describedby="composerValidation" aria-expanded="false" aria-autocomplete="list" placeholder="Message the room…"></textarea>
  <button id="sendButton" class="send-button" type="button">Send</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get("theme") === "light" ? "light" : "dark";

  // Stand in for the VS Code webview bridge.
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => console.log("[preview] postMessage", msg),
    getState: () => undefined,
    setState: () => undefined,
  });
</script>
<script src="../media/main.js?v=7"></script>
<script>
  const t = (n) => Date.now() - n * 60000;

  const snapshot = {
    type: "snapshot",
    connection: "online",
    status: "thinking",
    waitingOn: undefined,
    room: "tgtbt-review",
    mode: "byo",
    you: { handle: "mellery", displayName: "Mira", present: true, color: 5, role: "owner",
      agents: [{ id: "i:coder", owner: "mellery", label: "Mira's coder", state: "thinking" }] },
    onboarding: {
      steps: [
        { label: "Joined room", status: "complete" },
        { label: "Agent ready", status: "complete" },
        { label: "Start collaborating", status: "complete" },
      ],
      readOnly: false,
      complete: true,
      showAgentHelp: false,
    },
    roster: [
      { handle: "mellery", displayName: "Mira", present: true, color: 5, role: "owner",
        agents: [{ id: "i:coder", owner: "mellery", label: "Mira's coder", state: "thinking" }] },
      { handle: "swhitfield", displayName: "Sam Whitfield", present: true, color: 0, role: "member", agents: [] },
      { handle: "kate", displayName: "Kate Nakamura", present: false, color: 3, role: "member",
        agents: [{ id: "k:1", owner: "kate", label: "Kate's agent", state: "idle" }] },
    ],
    transcript: [
      { id: "s1", kind: "system", authorHandle: "system", authorName: "system",
        text: "Sam Whitfield joined the room.", ts: t(14) },
      { id: "h1", kind: "human", authorHandle: "mellery", authorName: "Mira",
        text: "can you check the sharpe on the latest tgtbt run?", ts: t(12) },
      { id: "h2", kind: "human", authorHandle: "swhitfield", authorName: "Sam Whitfield",
        text: "^ and compare it against last week's — mine looked off after the resampling change", ts: t(11) },
      { id: "a1", kind: "agent", authorHandle: "agent", authorName: "Agent",
        text: "Read `results/latest.json` from **Mira's** workspace and `results/2026-07-18.json` from **Sam's**.\n\n" +
              "Mira's run: **1.42**. Sam's from last week: **1.31**.\n\n" +
              "The gap is the resampling change Sam mentioned — his run still uses close-to-close returns:\n\n" +
              "```python\nrets = px.pct_change()          # Sam's branch\nrets = px.resample('1D').last().pct_change()   # Mira's\n```\n\n" +
              "So they aren't comparable yet. Sam, want me to re-run yours with Mira's resampling?",
        ts: t(9) },
      { id: "h3", kind: "human", authorHandle: "swhitfield", authorName: "Sam Whitfield",
        text: "yes please", ts: t(7) },
      { id: "s2", kind: "system", authorHandle: "system", authorName: "system",
        text: "Kate Nakamura's agent joined the room.", ts: t(5) },
      { id: "h4", kind: "human", authorHandle: "kate", authorName: "Kate Nakamura",
        text: "careful — the 18th had a half-day, the resample will silently drop it", ts: t(4) },
      { id: "h5", kind: "human", authorHandle: "mellery", authorName: "Mira",
        text: "good catch — I'll update the mask", ts: t(3.5) },
      { id: "a2", kind: "agent", authorHandle: "kate", authorName: "Kate Nakamura's agent",
        text: "Confirmed from Kate's calendar file: 2026-07-18 is flagged `early_close`.", ts: t(3) },
    ],
    actions: [
      { id: "x1", agentId: "i:coder", agentLabel: "Mira's coder", targetHandle: "mellery",
        verb: "wrote", target: "packages/relay/src/room.ts", detail: "+41 −6", ok: true, ts: Date.now() },
      { id: "x2", agentId: "s:rev", agentLabel: "Sam's reviewer", targetHandle: "mellery",
        verb: "ran", target: "npm test", detail: "failed", ok: false, ts: Date.now() },
      { id: "x3", agentId: "k:1", agentLabel: "Kate's agent", targetHandle: "swhitfield",
        verb: "read", target: "results/latest.json", ok: true, ts: Date.now() },
    ],
    approvals: [{
      id: "ap_preview",
      agentLabel: "Mira Ellery's agent",
      toolName: "Bash",
      summary: 'command: npm test -- --runInBand\n(plus description)',
      rememberable: false,
    }],
    goals: [],
    goalAudit: [],
    roomRevision: 0,
    handoffs: [],
    handoffAudit: [],
    handoffRevision: 0,
    liveDeltas: [["a3", "Good catch, Kate. Re-running Sam's with Mira's resampling and an explicit half-day mask"]],
  };

  if (params.get("viewer") === "1") {
    snapshot.you.role = "viewer";
    snapshot.roster[0].role = "viewer";
    snapshot.onboarding = {
      steps: [
        { label: "Joined room", status: "complete" },
        { label: "Agent unavailable to viewers", status: "complete" },
        { label: "Follow along read-only", status: "current" },
      ],
      readOnly: true,
      complete: true,
      showAgentHelp: false,
    };
  }

  if (params.get("onboarding") === "join") {
    snapshot.connection = "offline";
    snapshot.status = "idle";
    snapshot.room = undefined;
    snapshot.mode = undefined;
    snapshot.you = undefined;
    snapshot.roster = [];
    snapshot.transcript = [];
    snapshot.actions = [];
    snapshot.approvals = [];
    snapshot.liveDeltas = [];
    snapshot.onboarding = {
      steps: [
        { label: "Joined room", status: "current" },
        { label: "Agent needs setup", status: "pending" },
        { label: "Start collaborating", status: "pending" },
      ],
      action: { kind: "joinRoom", label: "Join room" },
      readOnly: false,
      complete: false,
      showAgentHelp: false,
    };
  } else if (params.get("onboarding") === "attach") {
    snapshot.status = "idle";
    snapshot.you.agents = [];
    snapshot.roster[0].agents = [];
    snapshot.transcript = [];
    snapshot.actions = [];
    snapshot.approvals = [];
    snapshot.liveDeltas = [];
    snapshot.onboarding = {
      steps: [
        { label: "Joined room", status: "complete" },
        { label: "Agent ready", status: "complete" },
        { label: "Start collaborating", status: "current" },
      ],
      action: { kind: "attachAgent", label: "Attach agent" },
      readOnly: false,
      complete: false,
      showAgentHelp: false,
    };
  }

  document.getElementById("actions").open = params.get("work") === "1";
  window.dispatchEvent(new MessageEvent("message", { data: snapshot }));

  if (params.get("final") === "1") {
    window.dispatchEvent(new MessageEvent("message", { data: {
      type: "entry",
      entry: { id: "a3", kind: "agent", authorHandle: "mellery", authorName: "Mira's coder",
        text: "Re-run complete with the half-day mask. Sharpe: **1.39**.", ts: Date.now() }
    }}));
  }

  // ?diag=1 — measure what is overflowing, instead of guessing at it.
  if (params.get("diag") === "1") {
    setTimeout(() => {
      const rows = [];
      const push = (name, el) =>
        rows.push(`${name}: client=${el.clientWidth} scroll=${el.scrollWidth} offset=${el.offsetWidth}`);
      push("html", document.documentElement);
      push("body", document.body);
      push("header", document.getElementById("header"));
      push("transcript", document.getElementById("transcript"));
      push("composerBar", document.getElementById("composerBar"));

      let worst = null;
      document.querySelectorAll("*").forEach((el) => {
        const r = el.getBoundingClientRect();
        if (!worst || r.right > worst.right) worst = { right: r.right, el };
      });
      rows.push(`widest right edge: ${Math.round(worst.right)} — <${worst.el.tagName.toLowerCase()} class="${worst.el.className}">`);

      const box = document.createElement("pre");
      box.style.cssText =
        "position:fixed;inset:0;margin:0;padding:12px;background:#000;color:#0f0;font:12px monospace;z-index:9999;white-space:pre-wrap";
      box.textContent = rows.join("\n");
      document.body.appendChild(box);
    }, 100);
  }
</script>
</body>
</html>
