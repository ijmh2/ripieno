<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #14161a; color: #e8eaed;
    font: 16px/1.4 system-ui, -apple-system, sans-serif;
  }
  .calc { width: 320px; padding: 16px; border-radius: 16px; background: #1e2126; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #display {
    height: 72px; padding: 0 12px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: flex-end;
    background: #0f1114; border-radius: 10px;
    font-size: 34px; font-variant-numeric: tabular-nums;
    overflow-x: auto; white-space: nowrap;
  }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    height: 56px; border: 0; border-radius: 10px;
    background: #2b3037; color: inherit; font-size: 20px; cursor: pointer;
    transition: filter .1s;
  }
  button:hover { filter: brightness(1.25); }
  button:active { filter: brightness(.85); }
  .op { background: #3a4250; }
  .eq { background: #3b82f6; color: #fff; }
  .fn { background: #454b54; }
  .span2 { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calc">
    <div id="display" aria-live="polite">0</div>
    <div class="keys">
      <button class="fn" data-action="clear">AC</button>
      <button class="fn" data-action="sign">+/−</button>
      <button class="fn" data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="span2" data-digit="0">0</button>
      <button data-action="dot">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

<script>
const displayEl = document.getElementById('display');
let current = '0';     // string being typed
let stored = null;     // left-hand number
let pendingOp = null;  // '+', '-', '*', '/'
let freshEntry = true; // next digit starts a new number

const show = v => displayEl.textContent = v;

function compute(a, b, op) {
  switch (op) {
    case '+': return a + b;
    case '-': return a - b;
    case '*': return a * b;
    case '/': return b === 0 ? NaN : a / b;
  }
}

function format(n) {
  if (!isFinite(n)) return 'Error';
  // Trim float noise without killing precision for normal use.
  return String(parseFloat(n.toPrecision(12)));
}

function inputDigit(d) {
  if (freshEntry) { current = d; freshEntry = false; }
  else current = current === '0' ? d : current + d;
  show(current);
}

function inputDot() {
  if (freshEntry) { current = '0.'; freshEntry = false; }
  else if (!current.includes('.')) current += '.';
  show(current);
}

function setOp(op) {
  const value = parseFloat(current);
  if (pendingOp !== null && !freshEntry) {
    const result = compute(stored, value, pendingOp);
    stored = result;
    current = format(result);
    show(current);
  } else {
    stored = value;
  }
  pendingOp = op;
  freshEntry = true;
}

function equals() {
  if (pendingOp === null) return;
  const result = compute(stored, parseFloat(current), pendingOp);
  current = format(result);
  show(current);
  stored = null;
  pendingOp = null;
  freshEntry = true;
}

function clearAll() {
  current = '0'; stored = null; pendingOp = null; freshEntry = true;
  show(current);
}

document.querySelector('.keys').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.digit) return inputDigit(b.dataset.digit);
  if (b.dataset.op) return setOp(b.dataset.op);
  switch (b.dataset.action) {
    case 'clear': return clearAll();
    case 'dot': return inputDot();
    case 'equals': return equals();
    case 'sign':
      current = format(parseFloat(current) * -1);
      return show(current);
    case 'percent':
      current = format(parseFloat(current) / 100);
      freshEntry = true;
      return show(current);
  }
});

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k >= '0' && k <= '9') return inputDigit(k);
  if (k === '.') return inputDot();
  if ('+-*/'.includes(k)) return setOp(k);
  if (k === 'Enter' || k === '=') { e.preventDefault(); return equals(); }
  if (k === 'Escape') return clearAll();
  if (k === 'Backspace') {
    if (freshEntry) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    if (current === '0') freshEntry = true;
    show(current);
  }
});
</script>
</body>
</html>
