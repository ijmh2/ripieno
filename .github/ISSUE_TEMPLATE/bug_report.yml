name: Bug report
description: Report reproducible incorrect behavior in Ripieno
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include room tokens, GitHub tokens, API keys, private code or exploit details. Follow SECURITY.md for security issues.
  - type: input
    id: version
    attributes:
      label: Ripieno version or commit
      placeholder: 0.0.2 / commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Editor, version, OS and provider
      placeholder: VS Code 1.x, macOS, ChatGPT / Codex
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
